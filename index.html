      background-image: url("https://dariaivans.neocities.org/portfolio_img/untitled_transparent.gif");

<body>
<div id="loading" style="font-family:Arial,sans-serif;padding:20px;position:absolute;">loading…</div>
<div id="pinball-world"></div>
<button id="worldReturn" hidden type="button" aria-label="Return from the upside-down page">↕ back</button>
<span id="liveStatus" class="sr-only" aria-live="polite"></span>
<dialog id="filmDialog" aria-label="Video preview"><div class="film-bar"><span>video</span><a id="filmLink" hidden target="_blank" rel="noopener noreferrer" aria-label="Open video in a new tab">↗</a><button type="button" id="filmClose" aria-label="Close video">×</button></div><div id="filmBody"></div></dialog>
<script>
  (async () => {
    const sources=[
      'https://raw.githubusercontent.com/Lshfn/navigation/042addcd5f2d11c8c2873d8bdd877e35774078d9/index.html',
      'https://cdn.jsdelivr.net/gh/Lshfn/navigation@042addcd5f2d11c8c2873d8bdd877e35774078d9/index.html'
    ];
    async function originalBoard(){
      let lastError;
      for(const url of sources){
        try{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);return await response.text();}
        catch(error){lastError=error;}
      }
      throw lastError||new Error('Could not load original navigation');
    }
    function loadScript(src){return new Promise((resolve,reject)=>{
      const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(new Error('Could not load '+src));document.body.appendChild(script);
    });}
    let importedBoard;
    try{
      const html=await originalBoard();
      const parsed=new DOMParser().parseFromString(html,'text/html');
      const board=parsed.querySelector('#board');
      if(!board)throw new Error('SVG board was not found');
      importedBoard=document.importNode(board,true);
      importedBoard.style.setProperty('visibility','hidden','important');
      importedBoard.style.setProperty('opacity','0','important');
      document.getElementById('pinball-world').appendChild(importedBoard);
      await loadScript('board-enhancements.js?v=pinball-20261109-roaming');
      await loadScript('spring-physics.js?v=pinball-20261109-roaming');
      await loadScript('script.js?v=20261124-cv');
      await loadScript('pinball-additions.js?v=20261121-flower-toggle-half');
      importedBoard.style.setProperty('opacity','1','important');
      importedBoard.style.setProperty('visibility','visible','important');
      document.getElementById('loading').remove();
    }catch(error){
      importedBoard?.remove();console.error(error);
      document.getElementById('loading').textContent='Navigation could not be loaded. Please refresh the page.';
    }
  })();
</script>
